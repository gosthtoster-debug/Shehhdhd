          static Ent  g_ents[off::MAX_ENT];
          static int  g_cnt = 0, g_sw = 0, g_sh = 0;

          static uint64_t nowMs() {
              timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              return (uint64_t)ts.tv_sec * 1000ull + (uint64_t)ts.tv_nsec / 1000000ull;
          }
          static void shmTryOpen() {
              int fd = open(off::SHM_PATH, O_RDONLY); if (fd < 0) return;
              struct stat st{};
              if (fstat(fd, &st) != 0 || (size_t)st.st_size < sizeof(Shm)) { close(fd); return; }   // payload hasn't sized it yet (SIGBUS guard)
              void* p = mmap(nullptr, sizeof(Shm), PROT_READ, MAP_SHARED, fd, 0);
              close(fd);
              if (p != MAP_FAILED) g_shm = (const Shm*)p;
          }
          static void shmPoll() {
              g_cnt = 0;
              if (!g_shm) return;
              for (int t = 0; t < 4; t++) {
                  uint32_t a = g_shm->seq; if (a & 1) continue;
                  __sync_synchronize();
                  int cnt = g_shm->cnt, sw = g_shm->sw, sh = g_shm->sh; uint64_t ts = g_shm->ts_ms;
                  if (cnt < 0) cnt = 0;
                  if (cnt > off::MAX_ENT) cnt = off::MAX_ENT;
                  memcpy(g_ents, g_shm->e, (size_t)cnt * sizeof(Ent));
                  __sync_synchronize();
                  if (g_shm->seq != a) continue;
                  if (nowMs() - ts > 1000) cnt = 0;   // collector dead / game paused
                  g_cnt = cnt; g_sw = sw; g_sh = sh;
                  return;
              }
          }

          // ── config ────────────────────────────────────────────────────────────────
          struct Cfg {
              bool  esp = true, box = true, hp = true, dist = true, skeleton = false, lines = false, team = false;
              float maxDist = 300.f, headH = off::HEAD_H, lineWidth = 2.f;
              float colEnemy[3] = {1.f, 0.2f, 0.f};
              float colTeam [3] = {0.2f, 1.f, 0.4f};
              float menuOpacity = 0.92f;
          } g_cfg;

          static void cfgSave() {
              FILE* f = fopen(off::CFG_PATH, "w"); if (!f) return;
              fprintf(f, "{\"esp\":%d,\"box\":%d,\"hp\":%d,\"dist\":%d,\"skeleton\":%d,"
                         "\"lines\":%d,\"team\":%d,\"maxDist\":%.0f,\"headH\":%.2f,"
                         "\"lw\":%.1f,\"opacity\":%.2f}\n",
                  g_cfg.esp, g_cfg.box, g_cfg.hp, g_cfg.dist, g_cfg.skeleton,
                  g_cfg.lines, g_cfg.team, (double)g_cfg.maxDist, (double)g_cfg.headH,
                  (double)g_cfg.lineWidth, (double)g_cfg.menuOpacity);
              fclose(f);
          }
          static void cfgLoad() {
              FILE* f = fopen(off::CFG_PATH, "r"); if (!f) return;
              char buf[512] = {}; fread(buf, 1, sizeof(buf) - 1, f); fclose(f);
              auto jd = [&](const char* k, double& v) -> bool {
                  char kk[32]; snprintf(kk, sizeof(kk), "\"%s\":", k);
                  const char* p = strstr(buf, kk); if (!p) return false;
                  v = strtod(p + strlen(kk), nullptr); return true;
              };
              double v;
              if (jd("esp", v))      g_cfg.esp = v != 0;
              if (jd("box", v))      g_cfg.box = v != 0;
              if (jd("hp", v))       g_cfg.hp = v != 0;
              if (jd("dist", v))     g_cfg.dist = v != 0;
              if (jd("skeleton", v)) g_cfg.skeleton = v != 0;
              if (jd("lines", v))    g_cfg.lines = v != 0;
              if (jd("team", v))     g_cfg.team = v != 0;
              if (jd("maxDist", v))  g_cfg.maxDist = (float)v;
              if (jd("headH", v))    g_cfg.headH = (float)v;
              if (jd("lw", v))       g_cfg.lineWidth = (float)v;
              if (jd("opacity", v))  g_cfg.menuOpacity = (float)v;
          }

          // ── EGL / ImGui ───────────────────────────────────────────────────────────
          static EGLDisplay g_dpy = EGL_NO_DISPLAY;
          static EGLSurface g_sur = EGL_NO_SURFACE;
          static EGLContext g_ctx = EGL_NO_CONTEXT;
          static ANativeWindow* g_win = nullptr;
          static int  g_dw = 0, g_dh = 0;        // window (square, long x long) — same trick as enenH/AndroidImgui, covers both rotations
          static int  g_scrW = 0, g_scrH = 0;    // visible landscape area: long x short
          static bool g_menuOpen = true;
          static volatile bool g_run = true;
          // writes where it died (module+offset) to stderr -> ends up in oxcheat.log; debuggerd still gets the re-raised signal
          static void crashWhere(uintptr_t a, const char* tag) {
              FILE* f = fopen("/proc/self/maps", "r"); if (!f) return;
              char line[512];
              while (fgets(line, sizeof(line), f)) {
                  unsigned long lo, hi, off;
                  if (sscanf(line, "%lx-%lx %*s %lx", &lo, &hi, &off) == 3 && a >= lo && a < hi) {
                      const char* name = "[anon]"; char* p = strchr(line, '/');
                      if (p) { p[strcspn(p, "\n")] = 0; name = p; }
                      fprintf(stderr, "[!] %s %#lx = %s+%#lx\n", tag, (unsigned long)a, name, (unsigned long)(a - lo + off));
                      break;
                  }
              }
              fclose(f);
          }
          static void crashHandler(int sig, siginfo_t* si, void* ucv) {
              ucontext_t* uc = (ucontext_t*)ucv;
              fprintf(stderr, "\n[!] CRASH sig=%d fault_addr=%p\n", sig, si ? si->si_addr : nullptr);
              crashWhere((uintptr_t)uc->uc_mcontext.pc, "pc");
              crashWhere((uintptr_t)uc->uc_mcontext.regs[30], "lr");
              fflush(stderr);                      // SA_RESETHAND: returning re-faults into the default action
          }
          static void onSig(int) { g_run = false; }

          static bool initEGL() {
              printf("[*] stage: GetDisplayInfo\n");
              auto di = anwc::ANativeWindowCreator::GetDisplayInfo();
              printf("[*] stage: display %dx%d rot %d\n", (int)di.width, (int)di.height, (int)di.orientation);
              int W = di.width, H = di.height;
              if (W <= 0 || H <= 0) { fprintf(stderr, "[-] GetDisplayInfo failed (libgui symbols for this Android version?)\n"); return false; }
              if (H > W) std::swap(W, H);
              g_scrW = W; g_scrH = H; g_dw = W; g_dh = W;
              printf("[*] stage: create surface %dx%d\n", g_dw, g_dh);
              g_win = anwc::ANativeWindowCreator::Create("oxcheat", g_dw, g_dh, false);
              printf("[*] stage: surface %p\n", (void*)g_win);
              if (!g_win) { fprintf(stderr, "[-] surface create failed\n"); return false; }

              printf("[*] stage: egl\n");
              g_dpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              eglInitialize(g_dpy, nullptr, nullptr);
              const EGLint attr[] = {EGL_BLUE_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_RED_SIZE, 8, EGL_ALPHA_SIZE, 8, EGL_DEPTH_SIZE, 16,
                                     EGL_RENDERABLE_TYPE, EGL_OPENGL_ES3_BIT, EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_NONE};
              EGLConfig cfg; EGLint n = 0;
              if (!eglChooseConfig(g_dpy, attr, &cfg, 1, &n) || !n) { fprintf(stderr, "[-] eglChooseConfig\n"); return false; }
              EGLint fmt = 0; eglGetConfigAttrib(g_dpy, cfg, EGL_NATIVE_VISUAL_ID, &fmt);
              ANativeWindow_setBuffersGeometry(g_win, 0, 0, fmt);
              const EGLint ca[] = {EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE};
              g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, ca);
              g_sur = eglCreateWindowSurface(g_dpy, cfg, g_win, nullptr);
              if (!eglMakeCurrent(g_dpy, g_sur, g_sur, g_ctx)) { fprintf(stderr, "[-] eglMakeCurrent\n"); return false; }
              eglSwapInterval(g_dpy, 1);
              printf("[+] overlay %dx%d (screen %dx%d)\n", g_dw, g_dh, g_scrW, g_scrH);
              return true;
          }

          static void loadFont(float px) {
              ImGuiIO& io = ImGui::GetIO();
              const char* fonts[] = {"/system/fonts/Roboto-Regular.ttf", "/system/fonts/NotoSans-Regular.ttf",
                                     "/system/fonts/DroidSans.ttf", "/system/fonts/NotoSansCJK-Regular.ttc"};
              for (const char* f : fonts)
                  if (access(f, R_OK) == 0 && io.Fonts->AddFontFromFileTTF(f, px)) return;
              ImGui::GetStyle().FontSizeBase = px;   // fallback: scale built-in font (imgui >= 1.92)
          }

          static bool initImGui() {
              IMGUI_CHECKVERSION();
              ImGui::CreateContext();
              ImGui::GetIO().IniFilename = nullptr;
              ImGui::StyleColorsDark();
              auto& s = ImGui::GetStyle();
              s.WindowRounding = 12; s.FrameRounding = 8; s.GrabRounding = 8;
              s.WindowPadding = {16, 16}; s.FramePadding = {12, 8};
              s.Colors[ImGuiCol_TitleBgActive] = {0.14f, 0.14f, 0.18f, 1.f};
              s.Colors[ImGuiCol_CheckMark]     = {0.40f, 0.90f, 0.55f, 1.f};
              s.Colors[ImGuiCol_SliderGrab]    = {0.40f, 0.90f, 0.55f, 1.f};
              s.Colors[ImGuiCol_Tab]           = {0.18f, 0.18f, 0.22f, 1.f};
              s.Colors[ImGuiCol_TabActive]     = {0.28f, 0.28f, 0.36f, 1.f};
              loadFont(26.f);
              ImGui_ImplAndroid_Init(g_win);
              ImGui_ImplOpenGL3_Init("#version 300 es");
              return true;
          }

          // ── menu ──────────────────────────────────────────────────────────────────
          static void drawMenu() {
              ImGui::GetStyle().Colors[ImGuiCol_WindowBg] = {0.10f, 0.10f, 0.13f, g_cfg.menuOpacity};

              ImGui::SetNextWindowPos({8, 8});
              ImGui::Begin("##tog", nullptr,
                  ImGuiWindowFlags_NoDecoration | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_AlwaysAutoResize |
                  ImGuiWindowFlags_NoSavedSettings | ImGuiWindowFlags_NoBackground);
              if (ImGui::Button(g_menuOpen ? "[X]" : "[M]")) g_menuOpen = !g_menuOpen;
              ImGui::End();
              if (!g_menuOpen) return;

              ImGui::SetNextWindowPos({(float)g_scrW * 0.5f, (float)g_scrH * 0.5f}, ImGuiCond_FirstUseEver, {0.5f, 0.5f});
              ImGui::SetNextWindowSize({760, 520}, ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowSizeConstraints({420, 300}, {(float)g_scrW, (float)g_scrH});
              ImGui::Begin("OxCheat", nullptr, ImGuiWindowFlags_NoScrollbar | ImGuiWindowFlags_NoNav);   // drag by title

              if (ImGui::BeginTabBar("tabs")) {
                  if (ImGui::BeginTabItem("ESP")) {
                      ImGui::Checkbox("ESP", &g_cfg.esp);
                      ImGui::SameLine(); ImGui::Checkbox("Box", &g_cfg.box);
                      ImGui::SameLine(); ImGui::Checkbox("HP", &g_cfg.hp);
                      ImGui::Checkbox("Distance", &g_cfg.dist);
                      ImGui::SameLine(); ImGui::Checkbox("Skeleton", &g_cfg.skeleton);
                      ImGui::SameLine(); ImGui::Checkbox("Lines", &g_cfg.lines);
                      ImGui::Checkbox("Show teammates", &g_cfg.team);
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##md", &g_cfg.maxDist, 25.f, 600.f, "max dist %.0f m");
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##hh", &g_cfg.headH, 1.0f, 2.6f, "box height %.2f m");
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##lw", &g_cfg.lineWidth, 1.f, 5.f, "line width %.1f");
                      ImGui::ColorEdit3("Enemy", &g_cfg.colEnemy[0]);
                      ImGui::ColorEdit3("Team", &g_cfg.colTeam[0]);
                      ImGui::EndTabItem();
                  }
                  if (ImGui::BeginTabItem("Config")) {
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##op", &g_cfg.menuOpacity, 0.3f, 1.f, "opacity %.2f");
                      float half = (ImGui::GetContentRegionAvail().x - ImGui::GetStyle().ItemSpacing.x) * 0.5f;
                      if (ImGui::Button("Save", {half, 0})) cfgSave();
                      ImGui::SameLine();
                      if (ImGui::Button("Load", {half, 0})) cfgLoad();
                      ImGui::Spacing();
                      ImGui::TextColored({0.5f, 0.5f, 0.5f, 1.f}, "cfg: %s", off::CFG_PATH);
                      if (g_cnt > 0) ImGui::TextColored({0.4f, 1.f, 0.5f, 1.f}, "entities: %d  game: %dx%d", g_cnt, g_sw, g_sh);
                      else           ImGui::TextColored({1.f, 0.7f, 0.3f, 1.f}, "waiting for game data...");
                      ImGui::EndTabItem();
                  }
                  ImGui::EndTabBar();
              }
              ImGui::End();
          }

          // ── ESP ───────────────────────────────────────────────────────────────────
          static void drawEsp() {
              if (!g_cfg.esp || g_cnt <= 0 || g_sw <= 0 || g_sh <= 0) return;
              // game px (Unity, bottom-left origin) -> overlay px (ImGui, top-left): y flipped, scaled to the visible landscape area
              float kx = (float)g_scrW / (float)g_sw, ky = (float)g_scrH / (float)g_sh;
              float hs = g_cfg.headH / off::HEAD_H;   // box-height slider rescales collector's head point
              ImDrawList* dl = ImGui::GetBackgroundDrawList();

              for (int i = 0; i < g_cnt; i++) {
                  Ent& e = g_ents[i];
                  if (!e.alive || e.dist > g_cfg.maxDist) continue;
                  if (e.team && !g_cfg.team) continue;

                  float fx = e.fx * kx, fy = ((float)g_sh - e.fy) * ky;
                  float hx = e.hx * kx, hy0 = ((float)g_sh - e.hy) * ky;
                  float hy = fy - (fy - hy0) * hs;
                  float h = fy - hy; if (h < 4.f) continue;
                  float w = h * 0.45f, cx = (fx + hx) * 0.5f;
                  float x0 = cx - w * 0.5f, x1 = cx + w * 0.5f;

                  float* c = e.team ? g_cfg.colTeam : g_cfg.colEnemy;
                  ImU32 col = IM_COL32((int)(c[0] * 255), (int)(c[1] * 255), (int)(c[2] * 255), 255);
                  ImU32 blk = IM_COL32(0, 0, 0, 200);
                  float lw = g_cfg.lineWidth;

                  if (g_cfg.lines) dl->AddLine({(float)g_scrW * 0.5f, (float)g_scrH}, {fx, fy}, col, 1.5f);
                  if (g_cfg.box) {
                      dl->AddRect({x0 - 1, hy - 1}, {x1 + 1, fy + 1}, blk, 0, 0, lw + 2);
                      dl->AddRect({x0, hy}, {x1, fy}, col, 0, 0, lw);
                  }
                  if (g_cfg.hp && e.hpMax > 1.f) {
                      float f = e.hp / e.hpMax; f = f < 0 ? 0 : (f > 1 ? 1 : f);
                      dl->AddRectFilled({x0 - 9, hy - 1}, {x0 - 4, fy + 1}, blk);
                      dl->AddRectFilled({x0 - 8, fy - h * f}, {x0 - 5, fy}, IM_COL32((int)(255 * (1 - f)), (int)(255 * f), 0, 255));
                  }
                  if (g_cfg.dist) {
                      char t[24]; snprintf(t, sizeof(t), "%dm", (int)e.dist);
                      float fs = ImGui::GetFontSize() * 0.7f;
                      ImVec2 sz = ImGui::GetFont()->CalcTextSizeA(fs, 1e9f, 0.f, t);
                      dl->AddText(ImGui::GetFont(), fs, {cx - sz.x * 0.5f, fy + 3}, IM_COL32_WHITE, t);
                  }
              }
          }

          static int runOverlay() {
              if (!initEGL()) return 1;
              printf("[*] stage: imgui\n");
              initImGui();
              printf("[*] stage: touch\n");
              cfgLoad();
              Touch_Init(g_scrW, g_scrH, 0, true);
              printf("[+] overlay up. tap [M] in the top-left corner. Ctrl-C to quit.\n");

              uint64_t lastOpen = 0;
              while (g_run) {
                  if (!g_shm && nowMs() - lastOpen > 1000) { lastOpen = nowMs(); shmTryOpen(); }
                  shmPoll();
                  Touch_UpdateImGui();

                  ImGui_ImplOpenGL3_NewFrame();
                  ImGui_ImplAndroid_NewFrame();
                  ImGui::NewFrame();
                  drawEsp();
                  drawMenu();
                  ImGui::Render();

                  glViewport(0, 0, g_dw, g_dh);
                  glClearColor(0, 0, 0, 0);
                  glClear(GL_COLOR_BUFFER_BIT);
                  ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
                  eglSwapBuffers(g_dpy, g_sur);
              }

              ImGui_ImplOpenGL3_Shutdown();
              ImGui_ImplAndroid_Shutdown();
              ImGui::DestroyContext();
              eglMakeCurrent(g_dpy, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
              eglDestroyContext(g_dpy, g_ctx);
              eglDestroySurface(g_dpy, g_sur);
              eglTerminate(g_dpy);
              anwc::ANativeWindowCreator::Destroy(g_win);
              Touch_Close();
              return 0;
          }

          // usage: oxcheat [libcheat.so path]   |   oxcheat --overlay   (skip injection)
          int main(int argc, char** argv) {
              if (geteuid() != 0) { fprintf(stderr, "need root\n"); return 1; }
              signal(SIGINT, onSig); signal(SIGTERM, onSig);
              { struct sigaction sa{}; sa.sa_sigaction = crashHandler; sa.sa_flags = SA_SIGINFO | SA_RESETHAND; sigemptyset(&sa.sa_mask);
                for (int s : {SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE}) sigaction(s, &sa, nullptr); }
              setvbuf(stdout, nullptr, _IONBF, 0);

              bool overlayOnly = argc > 1 && !strcmp(argv[1], "--overlay");
              if (!overlayOnly) {
                  char lib[512];
                  if (argc > 1) snprintf(lib, sizeof(lib), "%s", argv[1]);
                  else {
                      char self[512] = {};
                      ssize_t r = readlink("/proc/self/exe", self, sizeof(self) - 1);
                      if (r <= 0) { perror("readlink"); return 1; }
                      char* sl = strrchr(self, '/');
                      if (sl) { *sl = 0; snprintf(lib, sizeof(lib), "%s/libcheat.so", self); }
                      else snprintf(lib, sizeof(lib), "./libcheat.so");
                  }
                  if (!injectLib(lib)) return 1;
              }
              return runOverlay();
          }

          #endif // PAYLOAD
          OXEOF
          wc -l cheat.cpp
      - name: build (Android NDK on the runner, arm64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          echo "NDK=$NDK"
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          CXX=$BIN/aarch64-linux-android24-clang++
          I=$PWD/include
          $CXX -shared -fPIC -O2 -std=c++20 -fvisibility=hidden -DPAYLOAD -fno-exceptions -fno-rtti -nostdlib++ \
              cheat.cpp -ldl -llog -lm -Wl,--no-undefined -o libcheat.so
          CPPS="$I/ImGui/imgui.cpp $I/ImGui/imgui_draw.cpp $I/ImGui/imgui_widgets.cpp $I/ImGui/imgui_tables.cpp \
                $I/ImGui/backends/imgui_impl_android.cpp $I/ImGui/backends/imgui_impl_opengl3.cpp $I/Android_touch/TouchHelperA.cpp"
          $CXX -O2 -std=c++20 -DHOST -static-libstdc++ -I$I -I$I/ImGui -I$I/native_surface -I$I/Android_touch \
              cheat.cpp $CPPS -llog -ldl -landroid -lEGL -lGLESv3 -o oxcheat
          $BIN/llvm-strip libcheat.so oxcheat
          echo "--- libcheat.so NEEDED (must not contain libc++):"; readelf -d libcheat.so | grep NEEDED
          ! readelf -d libcheat.so | grep -q 'c++'
          echo "--- oxcheat NEEDED:"; readelf -d oxcheat | grep NEEDED
          ls -l libcheat.so oxcheat
      - name: pack single file
        run: |
          set -e
          mkdir -p out
          cat > out/oxcheat_run.sh <<'OXEOF'
          #!/system/bin/sh
          # oxcheat_run.sh — готовый билд внутри, Termux/clang НЕ нужны. Только root.
          #   sh /data/local/tmp/oxcheat_run.sh        распаковать, запустить игру, инжект + оверлей (Ctrl-C = выход)
          #   sh /data/local/tmp/oxcheat_run.sh bg     то же, оверлей в фоне (лог: /data/local/tmp/oxcheat.log)
          #   sh /data/local/tmp/oxcheat_run.sh stop
          SELF=$(readlink -f "$0" 2>/dev/null || echo "$0")
          [ "$(id -u)" != "0" ] && exec su -c "sh '$SELF' $*"

          DIR=/data/local/tmp
          PKG="com.catsbit.oxidesurvivalisland"
          R='\033[31m' G='\033[32m' C='\033[36m' W='\033[0m'
          die(){ printf "${R}[-] %s${W}\n" "$1"; exit 1; }
          ok(){  printf "${G}[+] %s${W}\n" "$1"; }
          inf(){ printf "${C}[*] %s${W}\n" "$1"; }

          [ "$1" = "stop" ] && { for p in $(pidof oxcheat); do kill "$p"; done; ok "stopped"; exit 0; }

          for p in $(pidof oxcheat); do kill "$p" 2>/dev/null; done; sleep 1
          inf "распаковываю в $DIR ..."
          sed '1,/^__PAYLOAD__$/d' "$SELF" | base64 -d | tar xf - -C "$DIR" || die "распаковка не удалась (скачай файл заново)"
          chmod 755 "$DIR/oxcheat"; chmod 777 "$DIR/libcheat.so"

          if [ -z "$(pidof "$PKG")" ]; then
              inf "запускаю игру..."
              monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          fi
          inf "ждём il2cpp, инжект, оверлей. меню: тап [M] слева сверху"
          if [ "$1" = "bg" ]; then
              nohup "$DIR/oxcheat" "$DIR/libcheat.so" >"$DIR/oxcheat.log" 2>&1 &
              sleep 1; ok "в фоне. лог: $DIR/oxcheat.log   стоп: sh $SELF stop"; exit 0
          fi
          LOG=$DIR/oxcheat.log
          {
              echo "== $(date)  android $(getprop ro.build.version.release) sdk $(getprop ro.build.version.sdk) $(getprop ro.product.model) $(getprop ro.product.cpu.abi)"
              "$DIR/oxcheat" "$DIR/libcheat.so"
              RC=$?
              echo "[exit code $RC]"
              if [ "$RC" != 0 ]; then echo "--- logcat crash buffer:"; logcat -d -b crash 2>/dev/null | tail -60; fi
              echo "--- logcat oxcheat (game side):"; logcat -d -s oxcheat 2>/dev/null | tail -40
          } 2>&1 | tee -i "$LOG"
          ok "лог: $LOG"
          exit 0
          __PAYLOAD__
          OXEOF
          tar cf - libcheat.so oxcheat | base64 -w 100 >> out/oxcheat_run.sh
          cp libcheat.so oxcheat out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: oxcheat
          path: out/*
