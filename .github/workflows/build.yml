name: build-oxcheat
# 1) этот файл положить в репо как .github/workflows/build.yml
# 2) вкладка Actions -> build-oxcheat -> Run workflow
# 3) через ~3 мин внизу страницы запуска: Artifacts -> oxcheat (zip) -> внутри oxcheat_run.sh
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: fetch sources (imgui v1.93.0 + enenH/AndroidImgui, pinned)
        run: |
          set -e
          git clone -q https://github.com/ocornut/imgui imgui && git -C imgui checkout -q c1aaac65e896a45f81f47a4d68f9959e0f86c859
          git clone -q https://github.com/enenH/AndroidImgui aimgui && git -C aimgui checkout -q 63c9d83620665f87dce26e0a6de9f209b6d69593
          I=$PWD/include
          mkdir -p $I/ImGui/backends $I/native_surface $I/Android_touch
          cp imgui/imgui*.cpp imgui/imgui*.h imgui/imstb_*.h imgui/imconfig.h $I/ImGui/ ; rm -f $I/ImGui/imgui_demo.cpp
          cp imgui/backends/imgui_impl_android.* imgui/backends/imgui_impl_opengl3.* imgui/backends/imgui_impl_opengl3_loader.h $I/ImGui/backends/
          cp aimgui/src/ANativeWindowCreator.h $I/native_surface/ANWC_real.h
          cp aimgui/src/VectorStruct.h aimgui/test/TouchHelperA.h aimgui/test/TouchHelperA.cpp aimgui/test/Utils.h aimgui/test/Log.h aimgui/test/spinlock.h $I/Android_touch/
          cat > $I/native_surface/ANativeWindowCreator.h <<'OXEOF'
          #pragma once
          #include <cstdint>
          #include <cstddef>
          #include "ANWC_real.h"   // enenH/AndroidImgui, namespace android, needs C++20
          namespace anwc = android;
          OXEOF
          cat >> $I/Android_touch/TouchHelperA.h <<'OXEOF'

          // ── shim: API that cheat.cpp expects ──
          #include "ANativeWindowCreator.h"
          inline bool Touch_Init(int w, int h, int /*orient*/, bool readOnly) {
              Touch::setOrientation((int)android::ANativeWindowCreator::GetDisplayInfo().orientation);
              return Touch::Init(Vector2((float)w, (float)h), readOnly);
          }
          inline void Touch_UpdateImGui() {    // reader thread already writes io.MousePos/MouseDown; here: keep rotation fresh
              static int n = 0;
              if (++n % 30 == 0) Touch::setOrientation((int)android::ANativeWindowCreator::GetDisplayInfo().orientation);
          }
          inline void Touch_Close() { Touch::Close(); }
          OXEOF
          cat > cheat.cpp <<'OXEOF'
          // cheat.cpp | arm64 Android | Oxide: Survival Island | ESP
          //
          // ONE source, TWO binaries (built by oxcheat.sh):
          //   libcheat.so  (-DPAYLOAD)  injected into the game. il2cpp collector only, no UI.
          //                             writes entity screen coords into a shared file (SHM_PATH).
          //   oxcheat      (-DHOST)     root process. ptrace-injects libcheat.so, then draws the overlay
          //                             (SurfaceFlinger surface + EGL/GLES3 + ImGui + evdev touch) from the shared file.
          // why split: libgui (needed to create the overlay surface) is private -> an app process can't dlopen it
          //            (linker namespace), and /dev/input needs root. so UI lives in the root process, game-side stays tiny.
          //
          // build (oxcheat.sh does this):
          //   clang++ -shared -fPIC -O2 -std=c++20 -fvisibility=hidden -DPAYLOAD -fno-exceptions -fno-rtti -nostdlib++ \
          //           cheat.cpp -ldl -llog -lm -Wl,--no-undefined -o libcheat.so
          //   clang++ -O2 -std=c++20 -DHOST cheat.cpp <imgui cpps> <touch cpp> -Iinclude ... -llog -ldl -landroid -lEGL -lGLESv3 -o oxcheat
          //
          // run:  su -c /data/local/tmp/oxcheat      (menu: tap [M] in the corner)

          // ═══════════════════════════════════════════════════════════════════════════
          //  OFFSETS / CONFIG — единый блок, меняй здесь
          // ═══════════════════════════════════════════════════════════════════════════
          namespace off {
              constexpr const char* PKG        = "com.catsbit.oxidesurvivalisland";
              constexpr const char* IL2CPP_NS  = "Oxide";
              constexpr const char* IL2CPP_CLS = "PlayerManager";
              constexpr const char* F_EVENTS   = "playerEventHandler";
              constexpr const char* F_HEALTH   = "Health";
              constexpr const char* F_TEAM     = "teamName";
              constexpr const char* M_HP_A     = "Kek";   // FILL: obfuscated, re-dump with Il2CppDumper after each game update
              constexpr const char* M_HP_B     = "KeA";
              constexpr float       HEAD_H     = 1.8f;
              constexpr int         POLL_MS    = 50;
              constexpr int         MAX_ENT    = 64;
              constexpr const char* CFG_PATH   = "/data/local/tmp/.oxide_cfg.json";
              constexpr const char* LIB_DST    = "/data/data/com.catsbit.oxidesurvivalisland/cache/libcheat.so";
              constexpr const char* SHM_PATH   = "/data/data/com.catsbit.oxidesurvivalisland/cache/.oxe.shm";
          }

          #include <stdint.h>
          #include <stddef.h>

          // ── shared between payload and host (identical layout, both compiled from this file) ──
          struct Ent {
              float fx, fy, hx, hy;   // feet/head screen px, Unity convention: origin bottom-left, game resolution (sw x sh)
              float hp, hpMax, dist;
              int   team;             // 1 = same team as local player
              bool  alive;
          };
          struct Shm {
              volatile uint32_t seq;  // seqlock: odd = writer busy
              int32_t  cnt, sw, sh;
              uint64_t ts_ms;         // CLOCK_MONOTONIC ms of last write, host drops stale data
              Ent      e[off::MAX_ENT];
          };

          #ifdef PAYLOAD
          // ═══════════════════════════════════════════════════════════════════════════
          //  PAYLOAD — runs inside the game. no libc++ dependency on purpose (see build line).
          // ═══════════════════════════════════════════════════════════════════════════
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <pthread.h>
          #include <sys/mman.h>
          #include <sys/stat.h>
          #include <unistd.h>
          #include <time.h>
          #include <android/log.h>
          #include <math.h>
          #include <string.h>

          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "oxcheat", __VA_ARGS__)

          struct V3 { float x, y, z; };
          struct Name { char16_t c[64]; int n; };

          static bool g_run = true;
          static Shm* g_shm = nullptr;

          static uint64_t nowMs() {
              timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              return (uint64_t)ts.tv_sec * 1000ull + (uint64_t)ts.tv_nsec / 1000000ull;
          }
          static bool shmOpen() {
              int fd = open(off::SHM_PATH, O_RDWR | O_CREAT, 0666);
              if (fd < 0) { LOG("shm open failed"); return false; }
              fchmod(fd, 0666);
              if (ftruncate(fd, sizeof(Shm)) != 0) { close(fd); return false; }
              void* p = mmap(nullptr, sizeof(Shm), PROT_READ | PROT_WRITE, MAP_SHARED, fd, 0);
              close(fd);
              if (p == MAP_FAILED) return false;
              g_shm = (Shm*)p;
              if (g_shm->seq & 1) g_shm->seq++;   // previous run died mid-write
              return true;
          }
          static void publish(const Ent* e, int cnt, int sw, int sh) {
              if (!g_shm) return;
              g_shm->seq++; __sync_synchronize();
              if (cnt > 0) memcpy(g_shm->e, e, (size_t)cnt * sizeof(Ent));
              g_shm->cnt = cnt; g_shm->sw = sw; g_shm->sh = sh; g_shm->ts_ms = nowMs();
              __sync_synchronize(); g_shm->seq++;
          }

          // ── il2cpp bindings ───────────────────────────────────────────────────────
          static void* g_il = nullptr;
          static void*   (*il2cpp_domain_get)();
          static void**  (*il2cpp_domain_get_assemblies)(void*, size_t*);
          static void*   (*il2cpp_assembly_get_image)(void*);
          static void*   (*il2cpp_class_from_name)(void*, const char*, const char*);
          static void*   (*il2cpp_class_get_method_from_name)(void*, const char*, int);
          static void*   (*il2cpp_class_get_field_from_name)(void*, const char*);
          static size_t  (*il2cpp_field_get_offset)(void*);
          static void*   (*il2cpp_object_get_class)(void*);
          static void*   (*il2cpp_thread_attach)(void*);
          static void*   (*il2cpp_class_get_type)(void*);
          #define LOAD(n) n = (decltype(n))dlsym(g_il, #n)

          static void* findClass(const char* ns2, const char* name) {
              size_t n = 0; void** a = il2cpp_domain_get_assemblies(il2cpp_domain_get(), &n);
              for (size_t i = 0; i < n; i++)
                  if (void* k = il2cpp_class_from_name(il2cpp_assembly_get_image(a[i]), ns2, name)) return k;
              return nullptr;
          }
          static void*  meth(void* k, const char* n, int argc) { return k ? il2cpp_class_get_method_from_name(k, n, argc) : nullptr; }
          static void*  mp(void* mi)       { return mi ? *(void**)mi : nullptr; }                      // MethodInfo -> methodPointer
          static size_t arrLen(void* arr)  { return arr ? *(size_t*)((uintptr_t)arr + 0x18) : 0; }    // il2cpp array: len @0x18
          static void** arrPtr(void* arr)  { return arr ? (void**)((uintptr_t)arr + 0x20) : nullptr; }// items @0x20
          static Name readName(void* s) {                                                              // il2cpp string: len @0x10, chars @0x14
              Name r; r.n = 0;
              if (!s) return r;
              int len = *(int*)((uintptr_t)s + 0x10);
              if (len <= 0 || len > 63) return r;
              memcpy(r.c, (const void*)((uintptr_t)s + 0x14), (size_t)len * 2);
              r.n = len; return r;
          }
          static bool sameName(const Name& a, const Name& b) { return a.n == b.n && memcmp(a.c, b.c, (size_t)a.n * 2) == 0; }

          static void* poll_thread(void*) {
              if (!shmOpen()) return nullptr;
              while (!(g_il = dlopen("libil2cpp.so", RTLD_NOW | RTLD_NOLOAD))) sleep(1);
              LOAD(il2cpp_domain_get); LOAD(il2cpp_domain_get_assemblies);
              LOAD(il2cpp_assembly_get_image); LOAD(il2cpp_class_from_name);
              LOAD(il2cpp_class_get_method_from_name); LOAD(il2cpp_class_get_field_from_name);
              LOAD(il2cpp_field_get_offset); LOAD(il2cpp_object_get_class);
              LOAD(il2cpp_thread_attach); LOAD(il2cpp_class_get_type);
              while (!il2cpp_domain_get()) sleep(1);
              sleep(8);
              il2cpp_thread_attach(il2cpp_domain_get());

              void* kp = nullptr;
              for (int i = 0; i < 30 && !(kp = findClass(off::IL2CPP_NS, off::IL2CPP_CLS)); i++) sleep(1);
              void* kcam = findClass("UnityEngine", "Camera");
              void* kcmp = findClass("UnityEngine", "Component");
              void* ktr  = findClass("UnityEngine", "Transform");
              void* kscr = findClass("UnityEngine", "Screen");
              void* kobj = findClass("UnityEngine", "Object");
              if (!kp || !kcam || !kcmp || !ktr || !kscr || !kobj) { LOG("class resolve failed"); return nullptr; }

              void* mi_fot = meth(kobj, "FindObjectsOfType", 1);
              if (!mi_fot) mi_fot = meth(kobj, "FindObjectsOfType", 0);
              void* mi_isLocal = meth(kp,   "get_isLocalPlayer", 0);
              void* mi_main    = meth(kcam, "get_main", 0);
              void* mi_w2s     = meth(kcam, "WorldToScreenPoint", 1);
              void* mi_trans   = meth(kcmp, "get_transform", 0);
              void* mi_pos     = meth(ktr,  "get_position", 0);
              void* mi_sw      = meth(kscr, "get_width", 0);
              void* mi_sh      = meth(kscr, "get_height", 0);
              void* ft = il2cpp_class_get_field_from_name(kp, off::F_TEAM);
              void* fe = il2cpp_class_get_field_from_name(kp, off::F_EVENTS);
              void* fv = il2cpp_class_get_field_from_name(kp, "vitals");
              if (!mi_fot || !mi_isLocal || !mi_main || !mi_w2s || !mi_trans || !mi_pos || !mi_sw || !mi_sh || !ft || !fe || !fv)
                  { LOG("member resolve failed"); return nullptr; }

              size_t o_team   = il2cpp_field_get_offset(ft);
              size_t o_events = il2cpp_field_get_offset(fe);
              size_t o_vitals = il2cpp_field_get_offset(fv);
              size_t o_health = 0, o_maxHp = 0;
              void  *mi_hp = nullptr, *mi_hp2 = nullptr;
              bool   healthReady = false;
              Name   localTeam; localTeam.n = 0;
              void*  playerType = il2cpp_class_get_type ? il2cpp_class_get_type(kp) : kp;
              (void)mi_hp2;

              typedef void* (*FindFn1)(void*, bool, void*);
              typedef void* (*FindFn0)(void*, void*);
              typedef int   (*IntFn)(void*);
              typedef void* (*ObjFn0)(void*);
              typedef void* (*ObjFn1)(void*, void*);
              typedef V3    (*PosFn)(void*, void*);
              typedef V3    (*W2SFn)(void*, V3, void*);
              typedef bool  (*BoolFn)(void*, void*);
              typedef float (*FloatFn)(void*, void*);
              LOG("collector up");

              while (g_run) {
                  usleep((useconds_t)off::POLL_MS * 1000u);
                  int sw = ((IntFn)mp(mi_sw))(mi_sw), sh = ((IntFn)mp(mi_sh))(mi_sh);
                  if (sw <= 0 || sh <= 0) continue;

                  Ent tmp[off::MAX_ENT]; int cnt = 0;
                  do {   // early exits -> publish empty list so the overlay clears
                      void* arr = nullptr;
                      if (mp(mi_fot)) {
                          arr = ((FindFn1)mp(mi_fot))(playerType, false, mi_fot);
                          if (!arr) arr = ((FindFn0)mp(mi_fot))(playerType, mi_fot);
                      }
                      if (!arr) break;
                      size_t count = arrLen(arr); void** objs = arrPtr(arr);
                      if (!objs || count == 0) break;

                      void* cam = ((ObjFn0)mp(mi_main))(mi_main); if (!cam) break;
                      void* ct  = ((ObjFn1)mp(mi_trans))(cam, mi_trans); if (!ct) break;
                      V3 cp = ((PosFn)mp(mi_pos))(ct, mi_pos);
                      W2SFn w2s = (W2SFn)mp(mi_w2s);   // Unity: screen px, origin bottom-left, z<0 = behind camera

                      for (size_t i = 0; i < count && cnt < off::MAX_ENT; i++) {
                          void* self = objs[i]; if (!self) continue;
                          if (((BoolFn)mp(mi_isLocal))(self, mi_isLocal)) {
                              localTeam = readName(*(void**)((uintptr_t)self + o_team)); continue;
                          }
                          if (!healthReady) {
                              void* ev = *(void**)((uintptr_t)self + o_events); if (!ev) continue;
                              void* f = il2cpp_class_get_field_from_name(il2cpp_object_get_class(ev), off::F_HEALTH);
                              if (!f) continue;
                              o_health = il2cpp_field_get_offset(f);
                              void* hobj = *(void**)((uintptr_t)ev + o_health); if (!hobj) continue;
                              void* hk = il2cpp_object_get_class(hobj);
                              mi_hp = meth(hk, off::M_HP_A, 0); mi_hp2 = meth(hk, off::M_HP_B, 0);
                              if (mi_hp) healthReady = true;
                              if (!healthReady) continue;
                          }
                          void* ev = *(void**)((uintptr_t)self + o_events); if (!ev) continue;
                          void* hobj = *(void**)((uintptr_t)ev + o_health); if (!hobj) continue;
                          float hp = ((FloatFn)mp(mi_hp))(hobj, mi_hp);
                          if (!(hp > 0.f)) continue;

                          float hpMax = 100.f;
                          if (o_vitals) {
                              void* vit = *(void**)((uintptr_t)self + o_vitals);
                              if (vit && !o_maxHp) {
                                  void* fmx = il2cpp_class_get_field_from_name(il2cpp_object_get_class(vit), "m_MaxHealth");
                                  if (fmx) o_maxHp = il2cpp_field_get_offset(fmx);
                              }
                              if (vit && o_maxHp) {
                                  float v = *(float*)((uintptr_t)vit + o_maxHp);
                                  if (v > 1.f && v < 100000.f) hpMax = v;
                              }
                          }

                          void* tr = ((ObjFn1)mp(mi_trans))(self, mi_trans); if (!tr) continue;
                          V3 p  = ((PosFn)mp(mi_pos))(tr, mi_pos);
                          V3 sf = w2s(cam, p, mi_w2s);
                          V3 sk = w2s(cam, V3{p.x, p.y + off::HEAD_H, p.z}, mi_w2s);
                          if (sf.z <= 0.f || sk.z <= 0.f) continue;

                          float dist = sqrtf((p.x - cp.x) * (p.x - cp.x) + (p.y - cp.y) * (p.y - cp.y) + (p.z - cp.z) * (p.z - cp.z));
                          Name team = readName(*(void**)((uintptr_t)self + o_team));

                          Ent& e = tmp[cnt++];
                          e.fx = sf.x; e.fy = sf.y; e.hx = sk.x; e.hy = sk.y;   // raw game px, host scales
                          e.hp = hp; e.hpMax = hpMax; e.dist = dist;
                          e.team = (localTeam.n > 0 && sameName(team, localTeam)) ? 1 : 0;
                          e.alive = true;
                      }
                  } while (0);
                  publish(tmp, cnt, sw, sh);
              }
              return nullptr;
          }

          __attribute__((constructor)) static void ctor() {
              pthread_t t;
              pthread_create(&t, nullptr, poll_thread, nullptr);
              pthread_detach(t);
          }

          #else
          // ═══════════════════════════════════════════════════════════════════════════
          //  HOST — root process: injector + overlay
          // ═══════════════════════════════════════════════════════════════════════════
          #include <dirent.h>
          #include <dlfcn.h>
          #include <elf.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <ucontext.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <sys/mman.h>
          #include <sys/ptrace.h>
          #include <sys/stat.h>
          #include <sys/uio.h>
          #include <sys/wait.h>
          #include <unistd.h>
          #include <android/log.h>
          #include <android/native_window.h>
          #include <EGL/egl.h>
          #include <GLES3/gl3.h>
          #include <algorithm>
          #include <cmath>
          #include <cstring>
          #include <initializer_list>
          #include <string>
          #include "ImGui/imgui.h"
          #include "ImGui/backends/imgui_impl_android.h"
          #include "ImGui/backends/imgui_impl_opengl3.h"
          #include "Android_touch/TouchHelperA.h"

          #define LOG(...) __android_log_print(ANDROID_LOG_INFO, "oxcheat", __VA_ARGS__)

          #ifndef NT_ARM_SYSTEM_CALL
          #define NT_ARM_SYSTEM_CALL 0x404
          #endif

          // ── injector (ptrace + remote dlopen) ─────────────────────────────────────
          struct Regs { uint64_t x[31]; uint64_t sp, pc, pstate; };

          static bool getRegs(pid_t t, Regs& r) { iovec io{&r, sizeof(r)}; return ptrace(PTRACE_GETREGSET, t, (void*)NT_PRSTATUS, &io) == 0; }
          static bool setRegs(pid_t t, Regs& r) { iovec io{&r, sizeof(r)}; return ptrace(PTRACE_SETREGSET, t, (void*)NT_PRSTATUS, &io) == 0; }
          static int  getSys (pid_t t)          { int n = -1; iovec io{&n, sizeof(n)}; ptrace(PTRACE_GETREGSET, t, (void*)NT_ARM_SYSTEM_CALL, &io); return n; }
          static void setSys (pid_t t, int n)   { iovec io{&n, sizeof(n)}; ptrace(PTRACE_SETREGSET, t, (void*)NT_ARM_SYSTEM_CALL, &io); }

          static pid_t findPid(const char* pkg) {
              DIR* d = opendir("/proc"); if (!d) return 0;
              pid_t found = 0;
              while (dirent* e = readdir(d)) {
                  pid_t p = (pid_t)atoi(e->d_name); if (p <= 0) continue;
                  char path[64], buf[256] = {};
                  snprintf(path, sizeof(path), "/proc/%d/cmdline", p);
                  int fd = open(path, O_RDONLY); if (fd < 0) continue;
                  read(fd, buf, sizeof(buf) - 1); close(fd);
                  if (!strcmp(buf, pkg)) { found = p; break; }
              }
              closedir(d); return found;
          }

          static uintptr_t modBase(pid_t pid, const std::string& full) {
              char p[64]; snprintf(p, sizeof(p), "/proc/%d/maps", pid);
              FILE* f = fopen(p, "r"); if (!f) return 0;
              std::string base = full.substr(full.rfind('/') == std::string::npos ? 0 : full.rfind('/') + 1);
              char line[1024]; uintptr_t exact = 0, byName = 0;
              while (fgets(line, sizeof(line), f)) {
                  unsigned long lo, hi, off2; char perm[8];
                  if (sscanf(line, "%lx-%lx %7s %lx", &lo, &hi, perm, &off2) != 4 || off2) continue;
                  char* path = strchr(line, '/'); if (!path) continue;
                  path[strcspn(path, "\n")] = 0;
                  if (full == path) { exact = lo; break; }
                  const char* b = strrchr(path, '/');
                  if (!byName && base == (b ? b + 1 : path)) byName = lo;
              }
              fclose(f); return exact ? exact : byName;
          }

          static uintptr_t remoteSym(pid_t pid, void* local) {
              Dl_info di{}; if (!dladdr(local, &di) || !di.dli_fname) return 0;
              uintptr_t rb = modBase(pid, di.dli_fname); if (!rb) return 0;
              return rb + ((uintptr_t)local - (uintptr_t)di.dli_fbase);
          }

          static bool memWrite(pid_t pid, uintptr_t addr, const void* buf, size_t n) {
              char p[64]; snprintf(p, sizeof(p), "/proc/%d/mem", pid);
              int fd = open(p, O_RDWR); if (fd < 0) return false;
              bool ok = pwrite(fd, buf, n, (off_t)addr) == (ssize_t)n; close(fd); return ok;
          }

          static bool remoteCall(pid_t t, uintptr_t fn, std::initializer_list<uint64_t> args, uint64_t& ret, const Regs& saved) {
              Regs r = saved; int i = 0;
              for (uint64_t v : args) r.x[i++] = v;
              r.x[30] = 0; r.pc = fn; r.sp = (saved.sp - 0x1000) & ~0xFull;   // lr=0 -> SIGSEGV at pc 0 marks return
              setSys(t, -1);
              if (!setRegs(t, r)) return false;
              if (ptrace(PTRACE_CONT, t, 0, 0)) return false;
              for (int k = 0; k < 64; k++) {
                  int st; if (waitpid(t, &st, __WALL) < 0 || !WIFSTOPPED(st)) return false;
                  int sig = WSTOPSIG(st);
                  if (sig == SIGSEGV) break;
                  ptrace(PTRACE_CONT, t, 0, (sig == SIGTRAP || sig == SIGSTOP) ? 0 : sig);
              }
              Regs o; if (!getRegs(t, o) || o.pc != 0) return false;
              ret = o.x[0]; return true;
          }

          static bool copyFile(const char* src, const char* dst) {
              if (!strcmp(src, dst)) return true;   // never O_TRUNC a file onto itself
              int fi = open(src, O_RDONLY); if (fi < 0) return false;
              int fo = open(dst, O_WRONLY | O_CREAT | O_TRUNC, 0755); if (fo < 0) { close(fi); return false; }
              char buf[65536]; ssize_t n;
              while ((n = read(fi, buf, sizeof(buf))) > 0) if (write(fo, buf, (size_t)n) != n) { close(fi); close(fo); return false; }
              close(fi); close(fo); return true;
          }

          static bool waitForIl2cpp(pid_t pid, int maxSec) {
              for (int i = 0; i < maxSec; i++) {
                  char p[64]; snprintf(p, sizeof(p), "/proc/%d/maps", pid);
                  FILE* f = fopen(p, "r");
                  if (f) {
                      char line[512]; bool found = false;
                      while (fgets(line, sizeof(line), f)) if (strstr(line, "libil2cpp.so")) { found = true; break; }
                      fclose(f);
                      if (found) return true;
                  }
                  sleep(1);
              }
              return false;
          }

          static bool injectLib(const char* lib) {
              printf("[*] lib: %s\n[*] pkg: %s\n", lib, off::PKG);
              pid_t pid = 0;
              for (int i = 0; i < 60 && !pid; i++) {
                  pid = findPid(off::PKG);
                  if (!pid) { printf("[*] waiting for game...\n"); sleep(2); }
              }
              if (!pid) { fprintf(stderr, "[-] game not running\n"); return false; }
              printf("[+] pid: %d\n[*] waiting for il2cpp...\n", pid);
              if (!waitForIl2cpp(pid, 120)) { fprintf(stderr, "[-] libil2cpp not loaded\n"); return false; }
              sleep(3);

              {   // already injected? (host restarted while game kept running)
                  char p[64]; snprintf(p, sizeof(p), "/proc/%d/maps", pid);
                  FILE* f = fopen(p, "r");
                  if (f) {
                      char line[512]; bool has = false;
                      while (fgets(line, sizeof(line), f)) if (strstr(line, "/libcheat.so")) { has = true; break; }
                      fclose(f);
                      if (has) { printf("[+] libcheat.so already in game, skipping inject\n"); return true; }
                  }
              }

              printf("[*] copy -> %s\n", off::LIB_DST);
              if (!copyFile(lib, off::LIB_DST)) { perror("copy"); return false; }
              struct stat gst{}; stat((std::string("/data/data/") + off::PKG).c_str(), &gst);
              chown(off::LIB_DST, gst.st_uid, gst.st_gid);
              chmod(off::LIB_DST, 0755);
              char cmd[512];   // selinux: give the lib the same label as the app's cache dir
              snprintf(cmd, sizeof(cmd), "chcon \"$(stat -c %%C /data/data/%s/cache)\" %s 2>/dev/null", off::PKG, off::LIB_DST);
              system(cmd);

              if (ptrace(PTRACE_ATTACH, pid, 0, 0)) { perror("attach"); return false; }
              int st; waitpid(pid, &st, __WALL);
              Regs saved; getRegs(pid, saved); int savedSys = getSys(pid);
              bool ok = false;
              uintptr_t rdlopen = remoteSym(pid, (void*)dlopen);
              if (!rdlopen) fprintf(stderr, "[-] remote dlopen not found\n");
              else {
                  uintptr_t str = (saved.sp - 0x800) & ~0xFull;
                  uint64_t h = 0;
                  if (!memWrite(pid, str, off::LIB_DST, strlen(off::LIB_DST) + 1)) perror("write path");
                  else if (!remoteCall(pid, rdlopen, {str, (uint64_t)RTLD_NOW}, h, saved)) fprintf(stderr, "[-] remote call failed\n");
                  else if (!h) fprintf(stderr, "[-] dlopen returned NULL (check: logcat -s oxcheat linker)\n");
                  else { printf("[+] injected\n"); ok = true; }
              }
              setSys(pid, savedSys); setRegs(pid, saved);
              ptrace(PTRACE_DETACH, pid, 0, 0);
              return ok;
          }

          // ── shared memory reader ──────────────────────────────────────────────────
          static const Shm* g_shm = nullptr;
          static Ent  g_ents[off::MAX_ENT];
          static int  g_cnt = 0, g_sw = 0, g_sh = 0;

          static uint64_t nowMs() {
              timespec ts; clock_gettime(CLOCK_MONOTONIC, &ts);
              return (uint64_t)ts.tv_sec * 1000ull + (uint64_t)ts.tv_nsec / 1000000ull;
          }
          static void shmTryOpen() {
              int fd = open(off::SHM_PATH, O_RDONLY); if (fd < 0) return;
              struct stat st{};
              if (fstat(fd, &st) != 0 || (size_t)st.st_size < sizeof(Shm)) { close(fd); return; }   // payload hasn't sized it yet (SIGBUS guard)
              void* p = mmap(nullptr, sizeof(Shm), PROT_READ, MAP_SHARED, fd, 0);
              close(fd);
              if (p != MAP_FAILED) g_shm = (const Shm*)p;
          }
          static void shmPoll() {
              g_cnt = 0;
              if (!g_shm) return;
              for (int t = 0; t < 4; t++) {
                  uint32_t a = g_shm->seq; if (a & 1) continue;
                  __sync_synchronize();
                  int cnt = g_shm->cnt, sw = g_shm->sw, sh = g_shm->sh; uint64_t ts = g_shm->ts_ms;
                  if (cnt < 0) cnt = 0;
                  if (cnt > off::MAX_ENT) cnt = off::MAX_ENT;
                  memcpy(g_ents, g_shm->e, (size_t)cnt * sizeof(Ent));
                  __sync_synchronize();
                  if (g_shm->seq != a) continue;
                  if (nowMs() - ts > 1000) cnt = 0;   // collector dead / game paused
                  g_cnt = cnt; g_sw = sw; g_sh = sh;
                  return;
              }
          }

          // ── config ────────────────────────────────────────────────────────────────
          struct Cfg {
              bool  esp = true, box = true, hp = true, dist = true, skeleton = false, lines = false, team = false;
              float maxDist = 300.f, headH = off::HEAD_H, lineWidth = 2.f;
              float colEnemy[3] = {1.f, 0.2f, 0.f};
              float colTeam [3] = {0.2f, 1.f, 0.4f};
              float menuOpacity = 0.92f;
          } g_cfg;

          static void cfgSave() {
              FILE* f = fopen(off::CFG_PATH, "w"); if (!f) return;
              fprintf(f, "{\"esp\":%d,\"box\":%d,\"hp\":%d,\"dist\":%d,\"skeleton\":%d,"
                         "\"lines\":%d,\"team\":%d,\"maxDist\":%.0f,\"headH\":%.2f,"
                         "\"lw\":%.1f,\"opacity\":%.2f}\n",
                  g_cfg.esp, g_cfg.box, g_cfg.hp, g_cfg.dist, g_cfg.skeleton,
                  g_cfg.lines, g_cfg.team, (double)g_cfg.maxDist, (double)g_cfg.headH,
                  (double)g_cfg.lineWidth, (double)g_cfg.menuOpacity);
              fclose(f);
          }
          static void cfgLoad() {
              FILE* f = fopen(off::CFG_PATH, "r"); if (!f) return;
              char buf[512] = {}; fread(buf, 1, sizeof(buf) - 1, f); fclose(f);
              auto jd = [&](const char* k, double& v) -> bool {
                  char kk[32]; snprintf(kk, sizeof(kk), "\"%s\":", k);
                  const char* p = strstr(buf, kk); if (!p) return false;
                  v = strtod(p + strlen(kk), nullptr); return true;
              };
              double v;
              if (jd("esp", v))      g_cfg.esp = v != 0;
              if (jd("box", v))      g_cfg.box = v != 0;
              if (jd("hp", v))       g_cfg.hp = v != 0;
              if (jd("dist", v))     g_cfg.dist = v != 0;
              if (jd("skeleton", v)) g_cfg.skeleton = v != 0;
              if (jd("lines", v))    g_cfg.lines = v != 0;
              if (jd("team", v))     g_cfg.team = v != 0;
              if (jd("maxDist", v))  g_cfg.maxDist = (float)v;
              if (jd("headH", v))    g_cfg.headH = (float)v;
              if (jd("lw", v))       g_cfg.lineWidth = (float)v;
              if (jd("opacity", v))  g_cfg.menuOpacity = (float)v;
          }

          // ── EGL / ImGui ───────────────────────────────────────────────────────────
          static EGLDisplay g_dpy = EGL_NO_DISPLAY;
          static EGLSurface g_sur = EGL_NO_SURFACE;
          static EGLContext g_ctx = EGL_NO_CONTEXT;
          static ANativeWindow* g_win = nullptr;
          static int  g_dw = 0, g_dh = 0;        // window (square, long x long) — same trick as enenH/AndroidImgui, covers both rotations
          static int  g_scrW = 0, g_scrH = 0;    // visible landscape area: long x short
          static bool g_menuOpen = true;
          static volatile bool g_run = true;
          // writes where it died (module+offset) to stderr -> ends up in oxcheat.log; debuggerd still gets the re-raised signal
          static void crashWhere(uintptr_t a, const char* tag) {
              FILE* f = fopen("/proc/self/maps", "r"); if (!f) return;
              char line[512];
              while (fgets(line, sizeof(line), f)) {
                  unsigned long lo, hi, off;
                  if (sscanf(line, "%lx-%lx %*s %lx", &lo, &hi, &off) == 3 && a >= lo && a < hi) {
                      const char* name = "[anon]"; char* p = strchr(line, '/');
                      if (p) { p[strcspn(p, "\n")] = 0; name = p; }
                      fprintf(stderr, "[!] %s %#lx = %s+%#lx\n", tag, (unsigned long)a, name, (unsigned long)(a - lo + off));
                      break;
                  }
              }
              fclose(f);
          }
          static void crashHandler(int sig, siginfo_t* si, void* ucv) {
              ucontext_t* uc = (ucontext_t*)ucv;
              fprintf(stderr, "\n[!] CRASH sig=%d fault_addr=%p\n", sig, si ? si->si_addr : nullptr);
              crashWhere((uintptr_t)uc->uc_mcontext.pc, "pc");
              crashWhere((uintptr_t)uc->uc_mcontext.regs[30], "lr");
              fflush(stderr);                      // SA_RESETHAND: returning re-faults into the default action
          }
          static void onSig(int) { g_run = false; }

          static bool initEGL() {
              printf("[*] stage: GetDisplayInfo\n");
              auto di = anwc::ANativeWindowCreator::GetDisplayInfo();
              printf("[*] stage: display %dx%d rot %d\n", (int)di.width, (int)di.height, (int)di.orientation);
              int W = di.width, H = di.height;
              if (W <= 0 || H <= 0) { fprintf(stderr, "[-] GetDisplayInfo failed (libgui symbols for this Android version?)\n"); return false; }
              if (H > W) std::swap(W, H);
              g_scrW = W; g_scrH = H; g_dw = W; g_dh = W;
              printf("[*] stage: create surface %dx%d\n", g_dw, g_dh);
              g_win = anwc::ANativeWindowCreator::Create("oxcheat", g_dw, g_dh, false);
              printf("[*] stage: surface %p\n", (void*)g_win);
              if (!g_win) { fprintf(stderr, "[-] surface create failed\n"); return false; }

              printf("[*] stage: egl\n");
              g_dpy = eglGetDisplay(EGL_DEFAULT_DISPLAY);
              eglInitialize(g_dpy, nullptr, nullptr);
              const EGLint attr[] = {EGL_BLUE_SIZE, 8, EGL_GREEN_SIZE, 8, EGL_RED_SIZE, 8, EGL_ALPHA_SIZE, 8, EGL_DEPTH_SIZE, 16,
                                     EGL_RENDERABLE_TYPE, EGL_OPENGL_ES3_BIT, EGL_SURFACE_TYPE, EGL_WINDOW_BIT, EGL_NONE};
              EGLConfig cfg; EGLint n = 0;
              if (!eglChooseConfig(g_dpy, attr, &cfg, 1, &n) || !n) { fprintf(stderr, "[-] eglChooseConfig\n"); return false; }
              EGLint fmt = 0; eglGetConfigAttrib(g_dpy, cfg, EGL_NATIVE_VISUAL_ID, &fmt);
              ANativeWindow_setBuffersGeometry(g_win, 0, 0, fmt);
              const EGLint ca[] = {EGL_CONTEXT_CLIENT_VERSION, 3, EGL_NONE};
              g_ctx = eglCreateContext(g_dpy, cfg, EGL_NO_CONTEXT, ca);
              g_sur = eglCreateWindowSurface(g_dpy, cfg, g_win, nullptr);
              if (!eglMakeCurrent(g_dpy, g_sur, g_sur, g_ctx)) { fprintf(stderr, "[-] eglMakeCurrent\n"); return false; }
              eglSwapInterval(g_dpy, 1);
              printf("[+] overlay %dx%d (screen %dx%d)\n", g_dw, g_dh, g_scrW, g_scrH);
              return true;
          }

          static void loadFont(float px) {
              ImGuiIO& io = ImGui::GetIO();
              const char* fonts[] = {"/system/fonts/Roboto-Regular.ttf", "/system/fonts/NotoSans-Regular.ttf",
                                     "/system/fonts/DroidSans.ttf", "/system/fonts/NotoSansCJK-Regular.ttc"};
              for (const char* f : fonts)
                  if (access(f, R_OK) == 0 && io.Fonts->AddFontFromFileTTF(f, px)) return;
              ImGui::GetStyle().FontSizeBase = px;   // fallback: scale built-in font (imgui >= 1.92)
          }

          static bool initImGui() {
              IMGUI_CHECKVERSION();
              ImGui::CreateContext();
              ImGui::GetIO().IniFilename = nullptr;
              ImGui::StyleColorsDark();
              auto& s = ImGui::GetStyle();
              s.WindowRounding = 12; s.FrameRounding = 8; s.GrabRounding = 8;
              s.WindowPadding = {16, 16}; s.FramePadding = {12, 8};
              s.Colors[ImGuiCol_TitleBgActive] = {0.14f, 0.14f, 0.18f, 1.f};
              s.Colors[ImGuiCol_CheckMark]     = {0.40f, 0.90f, 0.55f, 1.f};
              s.Colors[ImGuiCol_SliderGrab]    = {0.40f, 0.90f, 0.55f, 1.f};
              s.Colors[ImGuiCol_Tab]           = {0.18f, 0.18f, 0.22f, 1.f};
              s.Colors[ImGuiCol_TabActive]     = {0.28f, 0.28f, 0.36f, 1.f};
              loadFont(26.f);
              ImGui_ImplAndroid_Init(g_win);
              ImGui_ImplOpenGL3_Init("#version 300 es");
              return true;
          }

          // ── menu ──────────────────────────────────────────────────────────────────
          static void drawMenu() {
              ImGui::GetStyle().Colors[ImGuiCol_WindowBg] = {0.10f, 0.10f, 0.13f, g_cfg.menuOpacity};

              ImGui::SetNextWindowPos({8, 8});
              ImGui::Begin("##tog", nullptr,
                  ImGuiWindowFlags_NoDecoration | ImGuiWindowFlags_NoMove | ImGuiWindowFlags_AlwaysAutoResize |
                  ImGuiWindowFlags_NoSavedSettings | ImGuiWindowFlags_NoBackground);
              if (ImGui::Button(g_menuOpen ? "[X]" : "[M]")) g_menuOpen = !g_menuOpen;
              ImGui::End();
              if (!g_menuOpen) return;

              ImGui::SetNextWindowPos({(float)g_scrW * 0.5f, (float)g_scrH * 0.5f}, ImGuiCond_FirstUseEver, {0.5f, 0.5f});
              ImGui::SetNextWindowSize({760, 520}, ImGuiCond_FirstUseEver);
              ImGui::SetNextWindowSizeConstraints({420, 300}, {(float)g_scrW, (float)g_scrH});
              ImGui::Begin("OxCheat", nullptr, ImGuiWindowFlags_NoScrollbar | ImGuiWindowFlags_NoNav);   // drag by title

              if (ImGui::BeginTabBar("tabs")) {
                  if (ImGui::BeginTabItem("ESP")) {
                      ImGui::Checkbox("ESP", &g_cfg.esp);
                      ImGui::SameLine(); ImGui::Checkbox("Box", &g_cfg.box);
                      ImGui::SameLine(); ImGui::Checkbox("HP", &g_cfg.hp);
                      ImGui::Checkbox("Distance", &g_cfg.dist);
                      ImGui::SameLine(); ImGui::Checkbox("Skeleton", &g_cfg.skeleton);
                      ImGui::SameLine(); ImGui::Checkbox("Lines", &g_cfg.lines);
                      ImGui::Checkbox("Show teammates", &g_cfg.team);
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##md", &g_cfg.maxDist, 25.f, 600.f, "max dist %.0f m");
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##hh", &g_cfg.headH, 1.0f, 2.6f, "box height %.2f m");
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##lw", &g_cfg.lineWidth, 1.f, 5.f, "line width %.1f");
                      ImGui::ColorEdit3("Enemy", &g_cfg.colEnemy[0]);
                      ImGui::ColorEdit3("Team", &g_cfg.colTeam[0]);
                      ImGui::EndTabItem();
                  }
                  if (ImGui::BeginTabItem("Config")) {
                      ImGui::SetNextItemWidth(-1);
                      ImGui::SliderFloat("##op", &g_cfg.menuOpacity, 0.3f, 1.f, "opacity %.2f");
                      float half = (ImGui::GetContentRegionAvail().x - ImGui::GetStyle().ItemSpacing.x) * 0.5f;
                      if (ImGui::Button("Save", {half, 0})) cfgSave();
                      ImGui::SameLine();
                      if (ImGui::Button("Load", {half, 0})) cfgLoad();
                      ImGui::Spacing();
                      ImGui::TextColored({0.5f, 0.5f, 0.5f, 1.f}, "cfg: %s", off::CFG_PATH);
                      if (g_cnt > 0) ImGui::TextColored({0.4f, 1.f, 0.5f, 1.f}, "entities: %d  game: %dx%d", g_cnt, g_sw, g_sh);
                      else           ImGui::TextColored({1.f, 0.7f, 0.3f, 1.f}, "waiting for game data...");
                      ImGui::EndTabItem();
                  }
                  ImGui::EndTabBar();
              }
              ImGui::End();
          }

          // ── ESP ───────────────────────────────────────────────────────────────────
          static void drawEsp() {
              if (!g_cfg.esp || g_cnt <= 0 || g_sw <= 0 || g_sh <= 0) return;
              // game px (Unity, bottom-left origin) -> overlay px (ImGui, top-left): y flipped, scaled to the visible landscape area
              float kx = (float)g_scrW / (float)g_sw, ky = (float)g_scrH / (float)g_sh;
              float hs = g_cfg.headH / off::HEAD_H;   // box-height slider rescales collector's head point
              ImDrawList* dl = ImGui::GetBackgroundDrawList();

              for (int i = 0; i < g_cnt; i++) {
                  Ent& e = g_ents[i];
                  if (!e.alive || e.dist > g_cfg.maxDist) continue;
                  if (e.team && !g_cfg.team) continue;

                  float fx = e.fx * kx, fy = ((float)g_sh - e.fy) * ky;
                  float hx = e.hx * kx, hy0 = ((float)g_sh - e.hy) * ky;
                  float hy = fy - (fy - hy0) * hs;
                  float h = fy - hy; if (h < 4.f) continue;
                  float w = h * 0.45f, cx = (fx + hx) * 0.5f;
                  float x0 = cx - w * 0.5f, x1 = cx + w * 0.5f;

                  float* c = e.team ? g_cfg.colTeam : g_cfg.colEnemy;
                  ImU32 col = IM_COL32((int)(c[0] * 255), (int)(c[1] * 255), (int)(c[2] * 255), 255);
                  ImU32 blk = IM_COL32(0, 0, 0, 200);
                  float lw = g_cfg.lineWidth;

                  if (g_cfg.lines) dl->AddLine({(float)g_scrW * 0.5f, (float)g_scrH}, {fx, fy}, col, 1.5f);
                  if (g_cfg.box) {
                      dl->AddRect({x0 - 1, hy - 1}, {x1 + 1, fy + 1}, blk, 0, 0, lw + 2);
                      dl->AddRect({x0, hy}, {x1, fy}, col, 0, 0, lw);
                  }
                  if (g_cfg.hp && e.hpMax > 1.f) {
                      float f = e.hp / e.hpMax; f = f < 0 ? 0 : (f > 1 ? 1 : f);
                      dl->AddRectFilled({x0 - 9, hy - 1}, {x0 - 4, fy + 1}, blk);
                      dl->AddRectFilled({x0 - 8, fy - h * f}, {x0 - 5, fy}, IM_COL32((int)(255 * (1 - f)), (int)(255 * f), 0, 255));
                  }
                  if (g_cfg.dist) {
                      char t[24]; snprintf(t, sizeof(t), "%dm", (int)e.dist);
                      float fs = ImGui::GetFontSize() * 0.7f;
                      ImVec2 sz = ImGui::GetFont()->CalcTextSizeA(fs, 1e9f, 0.f, t);
                      dl->AddText(ImGui::GetFont(), fs, {cx - sz.x * 0.5f, fy + 3}, IM_COL32_WHITE, t);
                  }
              }
          }

          static int runOverlay() {
              if (!initEGL()) return 1;
              printf("[*] stage: imgui\n");
              initImGui();
              printf("[*] stage: touch\n");
              cfgLoad();
              Touch_Init(g_scrW, g_scrH, 0, true);
              printf("[+] overlay up. tap [M] in the top-left corner. Ctrl-C to quit.\n");

              uint64_t lastOpen = 0;
              while (g_run) {
                  if (!g_shm && nowMs() - lastOpen > 1000) { lastOpen = nowMs(); shmTryOpen(); }
                  shmPoll();
                  Touch_UpdateImGui();

                  ImGui_ImplOpenGL3_NewFrame();
                  ImGui_ImplAndroid_NewFrame();
                  ImGui::NewFrame();
                  drawEsp();
                  drawMenu();
                  ImGui::Render();

                  glViewport(0, 0, g_dw, g_dh);
                  glClearColor(0, 0, 0, 0);
                  glClear(GL_COLOR_BUFFER_BIT);
                  ImGui_ImplOpenGL3_RenderDrawData(ImGui::GetDrawData());
                  eglSwapBuffers(g_dpy, g_sur);
              }

              ImGui_ImplOpenGL3_Shutdown();
              ImGui_ImplAndroid_Shutdown();
              ImGui::DestroyContext();
              eglMakeCurrent(g_dpy, EGL_NO_SURFACE, EGL_NO_SURFACE, EGL_NO_CONTEXT);
              eglDestroyContext(g_dpy, g_ctx);
              eglDestroySurface(g_dpy, g_sur);
              eglTerminate(g_dpy);
              anwc::ANativeWindowCreator::Destroy(g_win);
              Touch_Close();
              return 0;
          }

          // usage: oxcheat [libcheat.so path]   |   oxcheat --overlay   (skip injection)
          int main(int argc, char** argv) {
              if (geteuid() != 0) { fprintf(stderr, "need root\n"); return 1; }
              signal(SIGINT, onSig); signal(SIGTERM, onSig);
              { struct sigaction sa{}; sa.sa_sigaction = crashHandler; sa.sa_flags = SA_SIGINFO | SA_RESETHAND; sigemptyset(&sa.sa_mask);
                for (int s : {SIGSEGV, SIGBUS, SIGILL, SIGABRT, SIGFPE}) sigaction(s, &sa, nullptr); }
              setvbuf(stdout, nullptr, _IONBF, 0);

              bool overlayOnly = argc > 1 && !strcmp(argv[1], "--overlay");
              if (!overlayOnly) {
                  char lib[512];
                  if (argc > 1) snprintf(lib, sizeof(lib), "%s", argv[1]);
                  else {
                      char self[512] = {};
                      ssize_t r = readlink("/proc/self/exe", self, sizeof(self) - 1);
                      if (r <= 0) { perror("readlink"); return 1; }
                      char* sl = strrchr(self, '/');
                      if (sl) { *sl = 0; snprintf(lib, sizeof(lib), "%s/libcheat.so", self); }
                      else snprintf(lib, sizeof(lib), "./libcheat.so");
                  }
                  if (!injectLib(lib)) return 1;
              }
              return runOverlay();
          }

          #endif // PAYLOAD
          OXEOF
          wc -l cheat.cpp
      - name: build (Android NDK on the runner, arm64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          echo "NDK=$NDK"
          BIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          CXX=$BIN/aarch64-linux-android24-clang++
          I=$PWD/include
          $CXX -shared -fPIC -O2 -std=c++20 -fvisibility=hidden -DPAYLOAD -fno-exceptions -fno-rtti -nostdlib++ \
              cheat.cpp -ldl -llog -lm -Wl,--no-undefined -o libcheat.so
          CPPS="$I/ImGui/imgui.cpp $I/ImGui/imgui_draw.cpp $I/ImGui/imgui_widgets.cpp $I/ImGui/imgui_tables.cpp \
                $I/ImGui/backends/imgui_impl_android.cpp $I/ImGui/backends/imgui_impl_opengl3.cpp $I/Android_touch/TouchHelperA.cpp"
          $CXX -O2 -std=c++20 -DHOST -static-libstdc++ -I$I -I$I/ImGui -I$I/native_surface -I$I/Android_touch \
              cheat.cpp $CPPS -llog -ldl -landroid -lEGL -lGLESv3 -o oxcheat
          $BIN/llvm-strip libcheat.so oxcheat
          echo "--- libcheat.so NEEDED (must not contain libc++):"; readelf -d libcheat.so | grep NEEDED
          ! readelf -d libcheat.so | grep -q 'c++'
          echo "--- oxcheat NEEDED:"; readelf -d oxcheat | grep NEEDED
          ls -l libcheat.so oxcheat
      - name: pack single file
        run: |
          set -e
          mkdir -p out
          cat > out/oxcheat_run.sh <<'OXEOF'
          #!/system/bin/sh
          # oxcheat_run.sh — готовый билд внутри, Termux/clang НЕ нужны. Только root.
          #   sh /data/local/tmp/oxcheat_run.sh        распаковать, запустить игру, инжект + оверлей (Ctrl-C = выход)
          #   sh /data/local/tmp/oxcheat_run.sh bg     то же, оверлей в фоне (лог: /data/local/tmp/oxcheat.log)
          #   sh /data/local/tmp/oxcheat_run.sh stop
          SELF=$(readlink -f "$0" 2>/dev/null || echo "$0")
          [ "$(id -u)" != "0" ] && exec su -c "sh '$SELF' $*"

          DIR=/data/local/tmp
          PKG="com.catsbit.oxidesurvivalisland"
          R='\033[31m' G='\033[32m' C='\033[36m' W='\033[0m'
          die(){ printf "${R}[-] %s${W}\n" "$1"; exit 1; }
          ok(){  printf "${G}[+] %s${W}\n" "$1"; }
          inf(){ printf "${C}[*] %s${W}\n" "$1"; }

          [ "$1" = "stop" ] && { for p in $(pidof oxcheat); do kill "$p"; done; ok "stopped"; exit 0; }

          for p in $(pidof oxcheat); do kill "$p" 2>/dev/null; done; sleep 1
          inf "распаковываю в $DIR ..."
          sed '1,/^__PAYLOAD__$/d' "$SELF" | base64 -d | tar xf - -C "$DIR" || die "распаковка не удалась (скачай файл заново)"
          chmod 755 "$DIR/oxcheat"; chmod 777 "$DIR/libcheat.so"

          if [ -z "$(pidof "$PKG")" ]; then
              inf "запускаю игру..."
              monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1
          fi
          inf "ждём il2cpp, инжект, оверлей. меню: тап [M] слева сверху"
          if [ "$1" = "bg" ]; then
              nohup "$DIR/oxcheat" "$DIR/libcheat.so" >"$DIR/oxcheat.log" 2>&1 &
              sleep 1; ok "в фоне. лог: $DIR/oxcheat.log   стоп: sh $SELF stop"; exit 0
          fi
          LOG=$DIR/oxcheat.log
          {
              echo "== $(date)  android $(getprop ro.build.version.release) sdk $(getprop ro.build.version.sdk) $(getprop ro.product.model) $(getprop ro.product.cpu.abi)"
              "$DIR/oxcheat" "$DIR/libcheat.so"
              RC=$?
              echo "[exit code $RC]"
              if [ "$RC" != 0 ]; then echo "--- logcat crash buffer:"; logcat -d -b crash 2>/dev/null | tail -60; fi
              echo "--- logcat oxcheat (game side):"; logcat -d -s oxcheat 2>/dev/null | tail -40
          } 2>&1 | tee -i "$LOG"
          ok "лог: $LOG"
          exit 0
          __PAYLOAD__
          OXEOF
          tar cf - libcheat.so oxcheat | base64 -w 100 >> out/oxcheat_run.sh
          cp libcheat.so oxcheat out/
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: oxcheat
          path: out/*

